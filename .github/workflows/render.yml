name: Render

# Renders a composition on GitHub's servers instead of the local Mac.
# Run it from the Actions tab ("Run workflow"), then download the mp4 from the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition id (A01 is Founder Mode Part 1)
        default: A01
      scale:
        description: Render scale (1 = 1080x1920, 0.5 = preview)
        default: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0
      - run: npx remotion browser ensure
      - run: npx remotion render src/index.ts "${{ inputs.composition }}" "out/${{ inputs.composition }}.mp4" --crf=17 --scale=${{ inputs.scale }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}
          path: out/${{ inputs.composition }}.mp4
          retention-days: 14
